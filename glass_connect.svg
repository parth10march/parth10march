  <!-- Center Frosted Glass Plaque -->
  <g transform="translate(200.0, 17.0)">
    <!-- Plaque backdrop shadow -->
    <rect width="420" height="56" rx="28" fill="#000000" fill-opacity="0.4" transform="translate(0, 3)"/>
    
    <!-- Plaque glass surface -->
    <rect width="420" height="56" rx="28" fill="url(#plaque-glass)" stroke="url(#plaque-border)" stroke-width="1.2"/>
    
    <!-- Plaque reflection highlight -->
    <path d="M 15 1 Q 210.0 1 405 1" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.3" fill="none"/>

    <!-- Plaque Icon & Title -->
    <text x="210.0" y="27" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" letter-spacing="1.2" fill="#FFFFFF" text-anchor="middle">
      🌐  CONNECT WITH ME
    </text>

    <!-- Plaque Subtitle -->
    <text x="210.0" y="43" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10.5" font-weight="500" letter-spacing="1.5" fill="#6C63FF" opacity="0.8" text-anchor="middle">
      // COLLABORATE &amp; GET IN TOUCH
