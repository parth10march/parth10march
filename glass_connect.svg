<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 90" width="100%" height="90">
  <defs>
    <!-- Chromatic Glowing Gradients -->
    <radialGradient id="glow-purple" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Specular Reflection Gradient -->
    <linearGradient id="glass-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Center Plaque Glass Gradient -->
    <linearGradient id="plaque-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.94"/>
    </linearGradient>

    <!-- Center Plaque Border Gradient -->
    <linearGradient id="plaque-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes orb-move-a {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 15px) scale(1.2); }
    }
    @keyframes orb-move-b {
      0%, 100% { transform: translate(0px, 0px) scale(1.1); }
      50% { transform: translate(-60px, -10px) scale(0.9); }
    }
    @keyframes orb-move-c {
      0%, 100% { transform: translate(0px, 0px) scale(0.95); }
      50% { transform: translate(30px, -15px) scale(1.15); }
    }
    @keyframes tile-shimmer {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.95; }
    }
    .glow-a { animation: orb-move-a 9s ease-in-out infinite; }
    .glow-b { animation: orb-move-b 11s ease-in-out infinite; }
    .glow-c { animation: orb-move-c 8s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="820" height="90" fill="#0D1117" rx="12"/>

  <!-- ================= CHROMATIC GLOWING LIGHTS ================= -->
  <g opacity="0.65" style="mix-blend-mode: screen;">
    <ellipse cx="220" cy="45" rx="180" ry="40" fill="url(#glow-purple)" class="glow-a"/>
    <ellipse cx="600" cy="45" rx="190" ry="40" fill="url(#glow-cyan)" class="glow-b"/>
    <ellipse cx="410" cy="45" rx="140" ry="35" fill="url(#glow-pink)" class="glow-c"/>
  </g>

  <!-- ================= GRID OF GLASS TILES ================= -->
