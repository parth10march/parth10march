    <circle cx="23.0" cy="23.0" r="19.0" fill="#161B22"/>
    <circle cx="23.0" cy="23.0" r="19.0" fill="none" stroke="#6C63FF" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.7"/>
